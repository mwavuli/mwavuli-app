# PR checks for the site: `astro check` (types and content collections) and `astro build`, and the
# infrastructure that hosts it, validated without AWS credentials. Pull requests only; deploy.yml
# publishes.
#
# CI_ENABLED guards CI-type jobs. Freeze and resume with no code change:
#     freeze:  gh variable set CI_ENABLED --body false
#     resume:  gh variable set CI_ENABLED --body true    (or: gh variable delete CI_ENABLED)
# Unset, or anything other than the exact string "false", means enabled. A frozen job
# reports "skipped", which satisfies required status checks.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: astro check · astro build
    runs-on: ubuntu-latest
    if: vars.CI_ENABLED != 'false' # CI kill-switch (see header)
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm build` is `astro check && astro build`: the typecheck and the bundle.
      - run: pnpm build

  infra:
    name: opentofu validate · test
    runs-on: ubuntu-latest
    if: vars.CI_ENABLED != 'false' # CI kill-switch (see header)
    defaults:
      run:
        working-directory: infra/modules/static-site
    steps:
      - uses: actions/checkout@v5
      # The version nyange-org pins in .tool-versions.
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      # -lockfile=readonly fails if the committed lock does not cover this runner's platform, so the
      # provider pin cannot quietly stop applying.
      - run: tofu init -backend=false -input=false -lockfile=readonly
      - run: tofu fmt -check -recursive
      - run: tofu validate
      # Against a mocked provider: no credentials, nothing created.
      - run: tofu test
      - name: Shell scripts
        working-directory: .
        run: shellcheck scripts/*.sh
