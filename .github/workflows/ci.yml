# Checks for the whole repository. `nx affected` runs lint, typecheck, test, build and check for the
# projects a change touches, and whatever depends on them: the Go API, the site, the web and mobile apps,
# the shared packages, and the infrastructure (OpenTofu validated and tested against mocked providers, no
# AWS credentials). Pull requests, and pushes to main; deploy.yml publishes the site.
#
# Remote cache: none until the workspace is connected to Nx Cloud. Run `pnpm nx connect` once, commit the
# `nxCloudId` it writes to nx.json, and add the repository secret NX_CLOUD_ACCESS_TOKEN. Nothing here
# changes. Without the secret (and in forks) the job runs on Nx's local cache alone.
#
# Mobile releases are not built here: they run on a developer's Mac through Fastlane (mobile/shell). The
# job checks the mobile code and bundles it with Expo's Metro, which is what CI can do without signing keys.
#
# CI_ENABLED guards CI-type jobs. Freeze and resume with no code change:
#     freeze:  gh variable set CI_ENABLED --body false
#     resume:  gh variable set CI_ENABLED --body true    (or: gh variable delete CI_ENABLED)
# Unset, or anything other than the exact string "false", means enabled. A frozen job
# reports "skipped", which satisfies required status checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The versions the infrastructure was developed against.
  TOFU_VERSION: 1.13.1
  TERRAGRUNT_VERSION: 1.1.6
  # SHA-256 of terragrunt_linux_amd64 in that release's SHA256SUMS.
  TERRAGRUNT_SHA256: d75a80bb264758ba00dabcb17f4b507fcdab4ca90d9e41f96750df036bf69b04

jobs:
  check:
    name: nx affected · lint typecheck test build check
    runs-on: ubuntu-latest
    if: vars.CI_ENABLED != 'false' # CI kill-switch (see header)
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # nx-set-shas looks up the last successful run on main
    env:
      EXPO_NO_TELEMETRY: '1'
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      # Nx finds what a change affects by comparing against the base, so it needs the history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Terragrunt
        run: |
          set -euo pipefail
          curl -fsSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          echo "${TERRAGRUNT_SHA256}  terragrunt" | sha256sum -c -
          sudo install -m 0755 terragrunt /usr/local/bin/terragrunt
      - run: pnpm install --frozen-lockfile
      # Sets NX_BASE and NX_HEAD: a pull request against its base, a push to main against the last
      # commit whose CI passed.
      - uses: nrwl/nx-set-shas@v5
      - run: pnpm format:check
      - run: pnpm nx affected -t lint typecheck test build check
