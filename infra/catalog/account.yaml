# The AWS account this repository's infrastructure lives in, and the names derived from it. Terragrunt
# reads this at PARSE time, before any AWS call: a backend cannot be configured from a value fetched
# by the thing it configures.
#
# The account is Mwavuli's own. Nothing here, and nothing in infra/, depends on any other account,
# organization or repository. Create the account, and an administrator identity for whoever applies,
# before the first apply (docs/design/site-infrastructure.md).

org_name: mwavuli
repo: mwavuli-site

# The state bucket is <org_name>-tfstate-<account_alias>-<home_region>, and a unit's state key is
# <repo>/<account_alias>/<region>/<unit-path>/tofu.tfstate. The alias is also the directory under
# infra/live/ that holds the account's units.
account_alias: prod

# The 12-digit id of the account. It ships unset on purpose: Terragrunt refuses to run until the owner
# supplies it, and the generated provider then refuses any other account.
account_id: unset

home_region: us-east-1

# State is replicated here, so losing the home region does not lose the infrastructure's memory.
replica_region: us-west-2

# The site's bucket. Global, and it outlives the account, so it carries no account id. The site unit
# creates it and the deploy role's policy names it.
site_bucket_name: mwavuli-site-prod-us-east-1

# The repository whose deploy workflow may assume the deploy role. Both ids are immutable: GitHub puts
# them in the OIDC subject, and they survive a rename or a transfer of the repository.
#   gh api /repos/nyange-app/mwavuli-site --jq .id
#   gh api /users/nyange-app --jq .id
github_org: nyange-app
github_owner_id: "314008686"
github_repo_id: "1451231111"
