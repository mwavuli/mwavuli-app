packages:
  - brand
  - packages/*
  - site
  - web/*
  - mobile/*

allowBuilds:
  esbuild: true
  nx: true
  sharp: true

# One version of each shared dependency, named here and referenced as `catalog:` or `catalog:<name>`.
# The site keeps its own ranges: its build is pinned to Astro's Vite (vite 6).
catalog:
  typescript: ^5.9.3
  vitest: ^5.1.0

catalogs:
  web:
    react: ^19.3.1
    react-dom: ^19.3.1
    react-router: ^8.5.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    vite: ^8.3.8
    '@vitejs/plugin-react': ^6.3.0
    jsdom: ^31.0.0
    tailwindcss: ^4.3.2
    '@tailwindcss/vite': ^4.3.2
    '@testing-library/react': ^16.3.3
    '@testing-library/user-event': ^14.6.9
    '@fontsource-variable/inter': ^5.3.0
    '@fontsource-variable/montserrat': ^5.3.0
